<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SellerFlow 도매처 전용</title><style>
body{font-family:system-ui,sans-serif;margin:0;background:#10131b;color:#edf0fa}main{max-width:850px;margin:40px auto;padding:24px}section{background:#1c2230;padding:22px;border-radius:16px;margin:18px 0}label{display:block;margin:12px 0}input,button{font:inherit;border-radius:9px;padding:12px;border:1px solid #454e62;background:#141923;color:inherit;max-width:100%;box-sizing:border-box}input:not([type=file]){display:block;width:100%;margin-top:6px}button{cursor:pointer;background:#6550e5;margin:5px}button:disabled{opacity:.5}small{color:#b2bbce}#message{white-space:pre-wrap;line-height:1.6}.item{border-top:1px solid #454e62;padding:16px 0}.item b{display:block;overflow-wrap:anywhere}h1{font-size:26px}#work[hidden]{display:none}
</style></head><body><main><h1>도매처 발주·송장 회신</h1><p>본인 도매처의 발주서만 확인할 수 있습니다.</p><section id="login"><label>도매처 이름<input id="supplier" autocomplete="organization"></label><label>전용 접속 키<input id="key" type="password" autocomplete="off"></label><button id="connect">접속</button><small>판매자가 전달한 전용 키를 입력하세요. 키는 이 화면의 메모리에만 보관합니다.</small></section><section id="work" hidden><button id="refresh">새로고침</button><button id="logout">접속 종료</button><h2>발주서</h2><div id="batches"></div><h2>송장 파일 회신</h2><p>주문번호·택배사·운송장번호 열이 있는 XLSX/XLS/CSV 파일을 선택하세요. 주문번호는 받은 발주서의 값을 그대로 사용하세요.</p><input id="files" type="file" multiple accept=".xlsx,.xls,.csv"><button id="upload">선택 파일 회신</button><p><small>접수 후 서버 검증·쿠팡 등록 결과가 반영될 때까지 시간이 걸립니다. 파일 회신만으로 쿠팡 등록이 완료되는 것은 아닙니다.</small></p><div id="uploads"></div></section><p id="message" role="status" aria-live="polite"></p></main><script type="module">
let supplierName="",accessKey="",busy=false;
const $=id=>document.getElementById(id),message=text=>$("message").textContent=text;
async function api(action,extra={}){
 const response=await fetch("/api/automation?action="+action,{method:"POST",headers:{"Content-Type":"application/json","X-SellerFlow-Supplier-Key":accessKey},body:JSON.stringify({supplierName,...extra}),signal:AbortSignal.timeout(30000)});
 const data=await response.json();if(!response.ok||!data.ok)throw Error(data.message||`접속·서버 상태를 확인하세요 (${response.status})`);return data;
}
async function task(fn){if(busy)return;busy=true;for(const b of document.querySelectorAll("button"))b.disabled=true;try{await fn();}catch(e){message(e.message);}finally{busy=false;for(const b of document.querySelectorAll("button"))b.disabled=false;}}
async function refresh(){
 const data=await api("supplier-list");$("batches").replaceChildren();
 if(!data.batches.length)$("batches").textContent="확인할 발주서가 없습니다.";
 for(const batch of data.batches){
  const row=document.createElement("div");row.className="item";
  const title=document.createElement("b");title.textContent=batch.id+" · "+batch.orderCount+"건 · "+batch.status;row.append(title);
  const download=document.createElement("button");download.textContent="발주서 다운로드";download.onclick=()=>task(async()=>{const file=await api("supplier-file",{batchId:batch.id});const bytes=Uint8Array.from(atob(file.fileBase64),x=>x.charCodeAt(0));const url=URL.createObjectURL(new Blob([bytes],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));const a=document.createElement("a");a.href=url;a.download=file.fileName;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);message("발주서를 내려받았습니다. 실제 확인한 뒤 발주 수신 확인을 눌러주세요.");});row.append(download);
  const ack=document.createElement("button");ack.textContent="발주 수신 확인";ack.onclick=()=>task(async()=>{if(!confirm("이 발주서를 확인하고 접수했나요?"))return;await api("supplier-ack",{batchId:batch.id});message("수신 확인을 접수했습니다. 서버 반영 후 상태가 바뀝니다.");});row.append(ack);$("batches").append(row);
 }
 $("uploads").replaceChildren();for(const upload of data.uploads||[]){const p=document.createElement("p");p.textContent="송장 회신: "+upload.status+(upload.result?` · 반영 ${upload.result.matched||0}건 · 확인 필요 ${upload.result.failed||0}건`:"");$("uploads").append(p);for(const e of upload.result?.errors||[]){const small=document.createElement("p");small.textContent=e;$("uploads").append(small);}}
}
$("connect").onclick=()=>task(async()=>{supplierName=$("supplier").value.trim();accessKey=$("key").value;if(!supplierName||!accessKey)throw Error("도매처 이름과 전용 키를 입력하세요.");await refresh();$("key").value="";$("login").hidden=true;$("work").hidden=false;message("접속했습니다.");});
$("refresh").onclick=()=>task(refresh);
$("logout").onclick=()=>{accessKey="";supplierName="";$("batches").replaceChildren();$("uploads").replaceChildren();$("files").value="";$("work").hidden=true;$("login").hidden=false;message("접속을 종료했습니다.");};
$("upload").onclick=()=>task(async()=>{
 const files=Array.from($("files").files);if(!files.length||files.length>20)throw Error("파일을 1~20개 선택하세요.");
 for(const file of files){if(file.size>2*1024*1024)throw Error(file.name+": 2MB 이하 파일로 나누어주세요.");const bytes=new Uint8Array(await file.arrayBuffer());const hash=Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256",bytes)),v=>v.toString(16).padStart(2,"0")).join("");const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(",")[1]);reader.onerror=reject;reader.readAsDataURL(file);});await api("inbox",{eventId:hash,fileName:file.name,fileBase64:data});}
 $("files").value="";message("송장 파일을 접수했습니다. 새로고침으로 검증 결과를 확인하세요.");await refresh();
});
</script></body></html>
