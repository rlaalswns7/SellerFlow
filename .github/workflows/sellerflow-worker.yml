name: SellerFlow background worker
on:
  workflow_dispatch:
  schedule:
    - cron: '3-58/5 * * * *'
permissions: {}
concurrency:
  group: sellerflow-background-worker
  cancel-in-progress: false
jobs:
  tick:
    if: vars.SELLERFLOW_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Invoke protected worker
        env:
          SITE_URL: ${{ vars.SELLERFLOW_SITE_URL }}
          CRON_SECRET: ${{ secrets.SELLERFLOW_CRON_SECRET }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          site=os.environ['SITE_URL'].rstrip('/')
          if urllib.parse.urlparse(site).scheme != 'https' or not os.environ['CRON_SECRET']:
              raise SystemExit('Configure HTTPS site URL and cron secret')
          req=urllib.request.Request(site+'/api/automation?action=run', data=b'{}', method='POST', headers={'Authorization':'Bearer '+os.environ['CRON_SECRET'],'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=70) as response:
              result=json.load(response)
          if result.get('ok') is not True:
              raise SystemExit('Worker returned failure; inspect authenticated dashboard')
          # Do not log customer/order details or credentials in a public Actions run.
          print(json.dumps({'ok':True,'paused':bool(result.get('paused')),'completed':len(result.get('completed',[]))}))
          PY
